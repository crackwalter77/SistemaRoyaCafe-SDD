
services:
  db:
    image: postgres:16-alpine
    container_name: roya-db
    environment:
      POSTGRES_DB: roya_cafe
      POSTGRES_USER: roya_user
      POSTGRES_PASSWORD: roya_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roya_user -d roya_cafe"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: roya-backend
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://roya_user:roya_pass@db:5432/roya_cafe
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: roya-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
